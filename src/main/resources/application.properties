spring.application.name=DhuStore
server.port=8080

# 默认激活 local profile：真实的数据库密码 / JWT 密钥放在 application-local.properties，
# 该文件已被 .gitignore 忽略，不会进入仓库。生产或 CI 可用环境变量 SPRING_PROFILES_ACTIVE 覆盖。
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===== 数据源 (MySQL) =====
# 敏感值一律走环境变量注入，请勿把真实密码写回本文件
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/dhustore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== MyBatis =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.wenhe.dhustore.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== JWT =====
# 建议至少 32 字节（HS256 要求），可用 openssl rand -base64 48 生成
jwt.secret=${JWT_SECRET:}
# token 有效期，单位毫秒，默认 24 小时
jwt.expiration=86400000
jwt.header=Authorization
jwt.token-prefix=Bearer
