spring.application.name=DhuStore
server.port=8080

# 默认激活 local profile：真实的数据库密码 / JWT 密钥放在 application-local.properties，
# 该文件已被 .gitignore 忽略，不会进入仓库。生产或 CI 可用环境变量 SPRING_PROFILES_ACTIVE 覆盖。
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===== 数据源 (MySQL) =====
# 敏感值一律走环境变量注入，请勿把真实密码写回本文件
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/dhustore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== MyBatis =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.wenhe.dhustore.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 交易规则 =====
# 运费：未达门槛收固定运费，达到门槛免运费
shop.freight.fee=10
shop.freight.free-threshold=99
# 下单后支付超时（分钟），超时由定时任务关单并回补库存
shop.order.pay-timeout-minutes=30
# 发货后自动确认收货天数
shop.order.auto-confirm-days=7
# 超时关单扫描间隔与单批处理量
shop.order.close-interval-ms=60000
shop.order.close-batch=50

# ===== JWT =====
# 建议至少 32 字节（HS256 要求），可用 openssl rand -base64 48 生成
jwt.secret=${JWT_SECRET:}
# token 有效期，单位毫秒，默认 24 小时
jwt.expiration=86400000
jwt.header=Authorization
jwt.token-prefix=Bearer

# ===== 文件上传 =====
# 单文件 5MB，整请求 50MB（一次最多 9 张）
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB
# 本地存储目录（相对项目根目录），仅在未配置 OSS 时使用
file.upload-dir=uploads
# 本地文件的访问前缀（由静态资源映射提供）
file.public-prefix=/uploads

# ===== 阿里云 OSS =====
# 区域：上海（oss-cn-shanghai），bucket：dhu-stroe
# AccessKey 属于敏感信息，不写在本文件：请在 application-local.properties 或环境变量中提供
storage.type=oss
aliyun.oss.endpoint=oss-cn-shanghai.aliyuncs.com
aliyun.oss.bucket=dhu-stroe
aliyun.oss.dir-prefix=product
aliyun.oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET:}
